<text x='40' y='224' font-family='Helvetica, Arial, sans-serif' font-size='18' font-weight='700' fill='#1f2933' text-anchor='start'>polyloop-rl</text>
<text x='40' y='244' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='700' fill='#52606d' text-anchor='start'>controller</text>
<text x='300' y='222' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='400' fill='#52606d' text-anchor='start'>cycles: snapshot → preflight → filter → train (rl, opsd) → evaluate → gate → promote</text>
<text x='300' y='240' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='400' fill='#52606d' text-anchor='start'>capture proxy: token-exact traces, session + next-state pairing, serves the live adapter</text>
<text x='300' y='258' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='400' fill='#52606d' text-anchor='start'>receipt: paired delta, bootstrap CI, regressions, logprob agreement; lineage; budget; UI</text>
<text x='300' y='276' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='400' fill='#52606d' text-anchor='start'>owns what is measured (held-out split, thresholds); never how an episode is run</text>
<text x='300' y='294' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='400' fill='#52606d' text-anchor='start'>reaches the model only over the Tinker API, the world only through an environment</text>
<text x='1060' y='296' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='end'>github.com/runnerelectrode/polyloop-rl</text>
