<text x='300' y='136' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='400' fill='#52606d' text-anchor='start'>no training code; the same shape as the built-in Docker Harbor environment</text>
<text x='1060' y='142' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='end'>github.com/polygramme/polyvoice</text>
<line x1='24' y1='174' x2='1076' y2='174' stroke='#1f2933' stroke-width='1.2' stroke-dasharray='6 5'/>
<rect x='200' y='161' width='700' height='26' rx='13' fill='white' stroke='#1f2933' stroke-width='1.2'/>
<text x='550' y='178' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='700' fill='#1f2933' text-anchor='middle'>Environment protocol: load_tasks · run_rollouts · preflight · session_hints · excluded_sessions</text>
<text x='1060' y='178' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='end'></text>
