<text x='40' y='398' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='700' fill='#52606d' text-anchor='start'>training primitives</text>
<text x='300' y='376' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='400' fill='#52606d' text-anchor='start'>rlcli serve: a Tinker-API server on SkyRL, trainer GPU + sampler GPU, LoRA, multi-adapter</text>
<text x='300' y='394' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='400' fill='#52606d' text-anchor='start'>token-in/token-out bridge across turns, Docker sandboxes, hinted OPSD teacher</text>
<text x='300' y='412' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='400' fill='#52606d' text-anchor='start'>trainer-vs-sampler logprob guard, trace import and pass-through capture</text>
<text x='300' y='430' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='400' fill='#52606d' text-anchor='start'>built on tinker-cookbook (renderers, RL + distillation loops) and SkyRL (Megatron, vLLM)</text>
<text x='1060' y='436' font-family='Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#52606d' text-anchor='end'>github.com/polygramme/rlcli</text>
