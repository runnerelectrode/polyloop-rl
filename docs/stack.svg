<text x='40' y='84' font-family='Helvetica, Arial, sans-serif' font-size='18' font-weight='700' fill='#1f2933' text-anchor='start'>polyvoice</text>
<text x='40' y='104' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='700' fill='#52606d' text-anchor='start'>environment + recipe</text>
<text x='300' y='82' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='400' fill='#52606d' text-anchor='start'>the world: Coval's simulated caller phones the proxy; the reward: Coval's judges</text>
<text x='300' y='100' font-family='Helvetica, Arial, sans-serif' font-size='12.5' font-weight='400' fill='#52606d' text-anchor='start'>the dental receptionist scenarios (pool 16, held-out 8) and system prompt</text>
