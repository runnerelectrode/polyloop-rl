[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyloop-rl"
version = "0.0.1"
description = "A continual-learning harness: cycles of filter, train, evaluate, gate, promote for agent policies."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["click>=8.1", "pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
# The demo stack: rlcli (SkyRL Tinker server + cookbook Harbor RL + Docker sandboxes), Harbor task format,
# the SWE-smith dataset loader. tinker-cookbook installs separately from rlcli's pinned git ref.
run = ["polygramme-rlcli[train]", "harbor", "datasets>=2.16", "tinker==0.25.0"]
dev = ["pytest>=8"]

[project.scripts]
polyloop = "polyloop.cli:main"

[tool.setuptools.packages.find]
include = ["polyloop*"]
